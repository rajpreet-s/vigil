<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Vigil — Agentic SRE Incident Command & Alert Storm Collapse</title>
    <meta
      name="description"
      content="Vigil correlates alert storms into atomic incidents with BFS topology blast radius, ChromaDB vector runbook RAG, and Gemini 3.8 Flash causal synthesis. Delivered to Slack & SRE Command Console."
    />
    <meta property="og:title" content="Vigil — Agentic SRE Incident Command" />
    <meta
      property="og:description"
      content="40:1 alert collapse, topology-aware root-cause discovery, and instant runbook retrieval for high-availability engineering teams."
    />
    <meta property="og:type" content="website" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var theme = urlTheme || localStorage.getItem('theme');
          if (!theme) {
            var m = document.cookie.match(/(?:^|; )theme=([^;]*)/);
            if (m) theme = m[1];
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
