apiVersion: v1
kind: Secret
metadata:
    name: vigil-secrets
    namespace: vigil
type: Opaque
stringData:
    POSTGRES_USER: 'docker'
    POSTGRES_PASSWORD: 'your-postgres-password'
    DATABASE_URL: 'postgresql://docker:your-postgres-password@db.vigil.svc.cluster.local:5432/vigil?schema=public'
    GEMINI_API_KEY: 'your-gemini-api-key'
    SLACK_BOT_TOKEN: 'xoxb-your-slack-bot-token'
    SLACK_SIGNING_SECRET: 'your-slack-signing-secret'
    SLACK_ONCALL_USER_ID: 'your-slack-user-id'
    SLACK_INCIDENTS_CHANNEL: 'your-slack-channel-id'
    GOOGLE_CLIENT_ID: 'your-google-client-id'
    GOOGLE_CLIENT_SECRET: 'your-google-client-secret'
    GOOGLE_REDIRECT_URI: 'https://vigilapp.in/api/auth/google/callback'
    JWT_SECRET: 'your-jwt-secret'
    GITHUB_WEBHOOK_SECRET: 'your-github-webhook-secret'
    LANGFUSE_SECRET_KEY: 'your-langfuse-secret-key'
    LANGFUSE_PUBLIC_KEY: 'your-langfuse-public-key'
    LANGFUSE_BASE_URL: 'https://us.cloud.langfuse.com'
    FRONTEND_URL: 'https://vigilapp.in/app'
