apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-agent
  namespace: vigil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vigil-agent
  template:
    metadata:
      labels:
        app: vigil-agent
    spec:
      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/project-60bff6c1-455a-4a5c-b3d/vigil-repo/vigil-agent:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: AGENT_PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: DATABASE_URL
            - name: CHROMA_URL
              value: "http://chroma.vigil.svc.cluster.local:8000"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: GEMINI_API_KEY
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: SLACK_BOT_TOKEN
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: SLACK_SIGNING_SECRET
            - name: SLACK_ONCALL_USER_ID
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: SLACK_ONCALL_USER_ID
            - name: SLACK_INCIDENTS_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: SLACK_INCIDENTS_CHANNEL
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: vigil
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: vigil-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-api
  namespace: vigil
spec:
  replicas: 2 # High-availability API
  selector:
    matchLabels:
      app: vigil-api
  template:
    metadata:
      labels:
        app: vigil-api
    spec:
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/project-60bff6c1-455a-4a5c-b3d/vigil-repo/vigil-api:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: DATABASE_URL
            - name: AGENT_URL
              value: "http://agent.vigil.svc.cluster.local:3001"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: vigil-secrets
                  key: GOOGLE_REDIRECT_URI
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-public
  namespace: vigil
spec:
  type: ClusterIP # Requests a public external IP from Google Cloud
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: vigil-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-app
  namespace: vigil
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigil-app
  template:
    metadata:
      labels:
        app: vigil-app
    spec:
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/project-60bff6c1-455a-4a5c-b3d/vigil-repo/vigil-app:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: vigil
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: vigil-app

