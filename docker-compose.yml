version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vigil_postgres
    restart: always
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: vigil
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
